[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-network-simulation"
version = "0.1.1"
description = "Public transport choice sets from a modified OpenTripPlanner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pandas>=3.0", "numpy>=2.0", "requests>=2.32"]
